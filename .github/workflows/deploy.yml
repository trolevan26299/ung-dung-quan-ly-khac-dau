name: Build and Deploy Khắc Dấu App

on:
  push:
    branches: [ product ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./Backend
        file: ./Backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/khacdau-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/khacdau-frontend:latest
        build-args: |
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/product'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Đồng bộ docker-compose.yml (đã có redis + REDIS_URL) lên VPS.
    # Chỉ ghi đè đúng file compose của app khac dau; .env trên VPS không bị đụng.
    - name: Sync docker-compose.yml to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: docker-compose.yml
        target: /root/khacdau-app

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /root/khacdau-app

          # Pull latest images
          docker pull ${{ secrets.DOCKER_USERNAME }}/khacdau-backend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/khacdau-frontend:latest

          # Start/refresh containers (redis + backend + frontend).
          # up -d chỉ tạo lại container nào có thay đổi, redis giữ nguyên volume.
          docker-compose up -d

          # Clean up unused images
          docker image prune -f 